name: Feature request
description: Suggest a focused improvement to pu-get
title: "[feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For a new board/source or a broken catalog link, use the **Source or broken
        link** form instead. For security issues, follow
        [SECURITY.md](https://github.com/dumbramkrishna/pu-get/blob/main/SECURITY.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user situation, not just the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should pu-get do? Include keybindings or CLI flags if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - TUI
        - CLI
        - Catalog/search
        - Downloads
        - Configuration
        - Documentation
        - Build/release
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This is not a request to rehost paid or unlicensed material.
          required: true
        - label: I searched existing issues and discussions first.
          required: true
        - label: This can be explained as one focused change.
          required: true
