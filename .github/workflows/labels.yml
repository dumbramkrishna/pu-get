name: Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: sync repository labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Create or update labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          # Never remove labels that are not listed here. This keeps labels
          # created manually in the GitHub UI from disappearing.
          delete-other-labels: false
          dry-run: false
