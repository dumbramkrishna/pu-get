name: Binaries

# Build downloadable archives without publishing a release. This is useful for
# smoke-testing a release candidate before a tag is pushed. The release
# workflow still publishes the canonical archives on a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Archive label, for example v0.0.1 (default: snapshot-<short sha>)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Resolve archive label
        id: label
        shell: bash
        env:
          REQUESTED: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          label="${REQUESTED:-}"
          if [ -z "$label" ]; then
            label="snapshot-$(git rev-parse --short HEAD)"
          else
            case "$label" in
              v*) ;;
              *) label="v${label}" ;;
            esac
          fi
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: binaries-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          set -euo pipefail
          dist="pu-get-${LABEL}-${TARGET}"
          mkdir -p "dist/${dist}"
          cp "target/${TARGET}/release/pu-get" "dist/${dist}/"
          cp README.md LICENSE CHANGELOG.md "dist/${dist}/"
          tar -czf "dist/${dist}.tar.gz" -C dist "${dist}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          $dist = "pu-get-$env:LABEL-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$dist" -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/pu-get.exe" "dist/$dist/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$dist/"
          Compress-Archive -Path "dist/$dist" -DestinationPath "dist/$dist.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: pu-get-binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: checksums
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: pu-get-binaries-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pu-get-*.tar.gz pu-get-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: pu-get-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
