name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dist="pu-get-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/${dist}"
          cp "target/${TARGET}/release/pu-get" "dist/${dist}/"
          cp README.md LICENSE CHANGELOG.md "dist/${dist}/"
          tar -czf "dist/${dist}.tar.gz" -C dist "${dist}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $dist = "pu-get-$env:GITHUB_REF_NAME-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$dist" -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/pu-get.exe" "dist/$dist/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$dist/"
          Compress-Archive -Path "dist/$dist" -DestinationPath "dist/$dist.zip"

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: pu-get-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum pu-get-*.tar.gz pu-get-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pu-get-*.tar.gz
            dist/pu-get-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
