# Curated official sources for pu-get.
#
# Rules:
#   * official boards / government bodies / open-licence publishers only
#   * never add rehosted paid or copyrighted guidebooks
#   * never add PDF URLs by hand; resolvers discover them
#
# Resolver kinds: ncert | cbse_academic | kseab | pue | generic_index
# Status:         verified | unverified (unverified sources are skipped by
#                 default; select them explicitly or pass --include-unverified)

[[source]]
id = "kseab-sslc-question-papers"
name = "KSEAB"
resolver = "kseab"
board = "kseeb"
base_url = "https://kseab.karnataka.gov.in/new-page/SSLC%20QUESTION%20PAPERS/en"
levels = ["SSLC"]
year_range = [2016, 2026]
status = "verified"
max_pages = 40

[[source]]
id = "kseab-sslc-model-syllabus"
name = "KSEAB"
resolver = "generic_index"
board = "kseeb"
base_url = "https://kseab.karnataka.gov.in/"
levels = ["SSLC"]
year_range = [2016, 2026]
status = "unverified"
include_terms = ["model paper", "model question", "syllabus"]
max_pages = 2

[[source]]
id = "pue-textbooks"
name = "PUE Karnataka"
resolver = "pue"
board = "pue"
base_url = "https://pue.karnataka.gov.in/new-page/TEXT%20BOOKS/kn"
levels = ["PUC 1", "PUC 2"]
year_range = [2016, 2026]
status = "verified"
max_pages = 1

