[package]
name = "pu-get"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Browse and download official study material for Karnataka, CBSE and NCERT boards from the terminal"
authors = ["pu-get contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/dumbramkrishna/pu-get"
homepage = "https://github.com/dumbramkrishna/pu-get"
documentation = "https://github.com/dumbramkrishna/pu-get#readme"
keywords = ["education", "textbooks", "cbse", "karnataka", "tui"]
categories = ["command-line-utilities", "education"]
default-run = "pu-get"

[lib]
name = "pu_get"
path = "src/lib.rs"

[[bin]]
name = "pu-get"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.9"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5.0"
futures-util = "0.3"
hex = "0.4"
indicatif = "0.17"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
    "gzip",
    "charset",
] }
rust-embed = "8.5"
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
